name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install eth-account web3 requests flask
      
      - name: Build EXE
        run: |
          pyinstaller --onefile --name polymarket-bot --console --add-data "pm_bot.py:." pm_bot.py
      
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-bot-windows
          path: dist/polymarket-bot.exe
